name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

env:
  AHK_VERSION: "2.0.28"
  AHK2EXE_TAG: "Ahk2Exe1.1.37.02a2"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart("v")
          $ver = (Select-String -Path src\version.ahk -Pattern 'APP_VERSION := "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "A tag v$tag não bate com APP_VERSION $ver em src/version.ahk" }

      - name: Baixar AutoHotkey e Ahk2Exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$env:AHK_VERSION" --repo AutoHotkey/AutoHotkey --pattern "AutoHotkey_$env:AHK_VERSION.zip" --dir tools
          gh release download $env:AHK2EXE_TAG --repo AutoHotkey/Ahk2Exe --pattern "$env:AHK2EXE_TAG.zip" --dir tools
          Expand-Archive "tools/AutoHotkey_$env:AHK_VERSION.zip" tools/ahk
          Expand-Archive "tools/$env:AHK2EXE_TAG.zip" tools/ahk2exe

      - name: Testes
        shell: pwsh
        run: |
          $p = Start-Process "$PWD\tools\ahk\AutoHotkey64.exe" -ArgumentList "`"$PWD\tests\run.ahk`"" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Testes travaram (timeout de 60s)" }
          if (Test-Path tests\results.txt) { Get-Content tests\results.txt } else { throw "tests\results.txt não foi gerado" }
          if ($p.ExitCode -ne 0) { throw "Testes falharam (exit $($p.ExitCode))" }

      - name: Compilar HotPaste.exe
        shell: pwsh
        run: |
          $ahk2exe = Get-ChildItem tools\ahk2exe -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          $ahkArgs = @("/in", "$PWD\src\main.ahk", "/out", "$PWD\HotPaste.exe", "/icon", "$PWD\assets\icon.ico", "/base", "$PWD\tools\ahk\AutoHotkey64.exe", "/silent")
          $p = Start-Process $ahk2exe.FullName -ArgumentList $ahkArgs -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Ahk2Exe travou (timeout)" }
          if (-not (Test-Path HotPaste.exe)) { throw "HotPaste.exe não foi gerado (exit $($p.ExitCode))" }

      - name: Teste de fumaça do .exe
        shell: pwsh
        run: |
          $app = Start-Process "$PWD\HotPaste.exe" -ArgumentList "--tray" -PassThru
          try {
            Start-Sleep -Seconds 4
            if ($app.HasExited) { throw "HotPaste.exe encerrou sozinho (exit $($app.ExitCode))" }
            # Com --tray nenhuma janela deve estar visível; um diálogo de erro do AutoHotkey mantém o processo vivo mas aparece aqui.
            $app.Refresh()
            if ($app.MainWindowHandle -ne 0) { throw "janela/diálogo inesperado com --tray" }
          } finally {
            if (-not $app.HasExited) { $app.Kill() }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: HotPaste
          path: HotPaste.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: HotPaste

      - name: Notas com o SHA256
        run: |
          HASH=$(sha256sum HotPaste.exe | cut -d' ' -f1 | tr a-z A-Z)
          printf 'SHA256 do HotPaste.exe:\n\n    %s\n\nPara conferir no PowerShell: `Get-FileHash HotPaste.exe`\n\nO arquivo ainda não tem assinatura digital, então o Windows pode mostrar "Fornecedor desconhecido". Veja no README como abrir.\n' "$HASH" > notes.md

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: HotPaste.exe
          body_path: notes.md
